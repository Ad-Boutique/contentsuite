<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Content Suite · ad.boutique</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Satoshi";src:url(/assets/fonts/Satoshi-Variable.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"ADB Serif";src:url(/assets/fonts/InstrumentSerif-Italic-latin.woff2) format("woff2");font-style:italic;font-weight:400;font-display:swap}
:root{color-scheme:light;--lime:#cdff00;--ink:#101010;--paper:#f4f3eb;--white:#fff;--graphite:#66665f;--line-dotted:rgba(15,15,15,.28);--gutter:clamp(20px,4vw,64px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--white);color:var(--ink);font-family:"Satoshi","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.topbar{height:72px;display:flex;align-items:center;gap:12px;border-bottom:1px dotted var(--line-dotted)}
.wordmark{font-weight:700;font-size:23px;letter-spacing:-.01em}
.topbar small{font-size:14px;color:var(--graphite)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:64px;max-width:900px}
h1{font-weight:700;font-size:clamp(39px,5.56vw,80px);line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 em{font-family:"ADB Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.005em}
p{font-size:clamp(17px,1.4vw,21px);line-height:1.5;color:var(--graphite);margin:0;max-width:52ch}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1px var(--ink);margin-right:10px;vertical-align:2px}
footer{padding-block:24px;border-top:1px dotted var(--line-dotted);font-size:14px;color:var(--graphite)}
</style>
</head>
<body>
<header class="topbar"><span class="wordmark">ad.boutique</span><small>Content Suite</small></header>
<main>
  <h1>Feedback, das direkt <em>im Schnitt landet.</em></h1>
  <p><span class="dot" aria-hidden="true"></span>Hier stimmen wir Videos und Inhalte mit unseren Kund:innen ab. Bitte öffnen Sie den persönlichen Link aus Ihrer Einladung, z. B. contentsuite.ad.boutique/projektname.</p>
</main>
<footer>ad.boutique · Wien</footer>
</body>
</html>
