<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Content Suite · Ad Boutique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f6f5;--surface:#fff;--ink:#0f2626;--muted:#5a6f6c;--line:#d7e1de;--brand:#009e76}
@media (prefers-color-scheme: dark){:root{--bg:#0a1514;--surface:#10201f;--ink:#e3eeeb;--muted:#93a8a4;--line:#223a38;--brand:#2bbf96;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;padding:16px;box-sizing:border-box}
.card{max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
h1{margin:6px 0 10px;font-size:26px}
p{color:var(--muted);line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Ad Boutique</div>
  <h1>Content Suite</h1>
  <p>Hier stimmen wir Videos und Inhalte mit unseren Kund:innen ab. Bitte öffnen Sie den persönlichen Link aus Ihrer Einladung, z. B. contentsuite.ad.boutique/projektname.</p>
</div>
</body>
</html>
